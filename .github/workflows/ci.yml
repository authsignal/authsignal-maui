name: Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.202

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: dotnet workload install maui-ios maui-android --version 10.0.202

      - run: native/ios/build.sh

      - run: native/android/build.sh

      - name: Restore
        run: |
          for project in src/Authsignal.Maui.Binding.Android src/Authsignal.Maui.Binding.iOS src/Authsignal.Maui tests/Authsignal.Maui.Tests; do
            dotnet restore $project --locked-mode
          done

      - run: dotnet build src/Authsignal.Maui -c Release --no-restore

      - run: dotnet test --project tests/Authsignal.Maui.Tests -c Release --no-restore
